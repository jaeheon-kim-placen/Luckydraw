<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>뽑기판 — Lucky Draw</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap">

  <!-- Firebase Compat SDK (v10) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script>
    // Firebase 초기화
    const firebaseConfig = {
      apiKey: "AIzaSyACxzoyxBe-hbPxX-J7KuXbTR2UF1d1pvg",
      authDomain: "lucky-draw-2abb7.firebaseapp.com",
      projectId: "lucky-draw-2abb7",
      storageBucket: "lucky-draw-2abb7.firebasestorage.app",
      messagingSenderId: "76915254823",
      appId: "1:76915254823:web:ab96416c67e625bc375002"
    };
    firebase.initializeApp(firebaseConfig);
  </script>

  <style>
  :root {
    --bg: #f0f0ff;
    --surface: #ffffff;
    --surface2: #e8e8f8;
    --border: #d4d4f0;
    --accent: #5a52e8;
    --accent2: #9f5af7;
    --accent-dim: #eeeeff;
    --gold: #b88000;
    --gold-bg: #fffaeb;
    --gold-bd: #e8c840;
    --green: #1a7a4a;
    --green-bg: #e6f5ee;
    --green-bd: #50b478;
    --text: #18183a;
    --text-dim: #6060aa;
    --cell-empty: #eeeeff;
    --cell-ehov: #e0e0ff;
    --cell-taken: #d5edd9;
    --cell-taken-t: #1a5a34;
    --cell-mine: #bce8cc;
    --cell-mine-t: #0d4526;
    --cell-won: #fff3b8;
    --cell-won-t: #7a5400;
    --danger: #cc3333;
    --sh: 0 2px 14px rgba(90,82,232,.08);
    --sh-lg: 0 8px 36px rgba(90,82,232,.15);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0c1c; --surface: #1a1a32; --surface2: #242448;
      --border: #2e2e58; --accent: #7c75ff; --accent2: #b47aff;
      --accent-dim: #1c1c3a; --gold: #f5c542; --gold-bg: #1c1400;
      --gold-bd: #a87800; --green: #4ed87a; --green-bg: #081a10;
      --green-bd: #2a6a44; --text: #e4e4ff; --text-dim: #8888cc;
      --cell-empty: #1a1a32; --cell-ehov: #222248; --cell-taken: #0c2818;
      --cell-taken-t: #4ed87a; --cell-mine: #08281a; --cell-mine-t: #7aeaaa;
      --cell-won: #281c00; --cell-won-t: #f5c542; --danger: #ff5555;
      --sh: 0 2px 14px rgba(0,0,0,.35); --sh-lg: 0 8px 36px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0c1c; --surface: #1a1a32; --surface2: #242448;
    --border: #2e2e58; --accent: #7c75ff; --accent2: #b47aff;
    --accent-dim: #1c1c3a; --gold: #f5c542; --gold-bg: #1c1400;
    --gold-bd: #a87800; --green: #4ed87a; --green-bg: #081a10;
    --green-bd: #2a6a44; --text: #e4e4ff; --text-dim: #8888cc;
    --cell-empty: #1a1a32; --cell-ehov: #222248; --cell-taken: #0c2818;
    --cell-taken-t: #4ed87a; --cell-mine: #08281a; --cell-mine-t: #7aeaaa;
    --cell-won: #281c00; --cell-won-t: #f5c542; --danger: #ff5555;
    --sh: 0 2px 14px rgba(0,0,0,.35); --sh-lg: 0 8px 36px rgba(0,0,0,.55);
  }

  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 20px;
  }

  /* ── LOGIN ── */
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100svh - 40px);
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 52px 40px 44px;
    box-shadow: var(--sh-lg);
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    text-align: center;
  }
  @media (max-width: 480px) { .login-card { padding: 40px 24px 36px; } }
  .login-icon { font-size: 3.2rem; line-height: 1; }
  .login-card h1 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: 2.1rem;
    letter-spacing: -.04em;
    color: var(--accent);
  }
  .login-card p { color: var(--text-dim); font-size: .9rem; }
  .host-badge {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border-radius: 20px;
    padding: 5px 16px;
    font-size: .8rem;
    font-weight: 700;
    letter-spacing: .04em;
  }
  .btn-host-toggle {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: inherit;
    font-size: .82rem;
    font-weight: 500;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
    transition: color .15s, background .15s;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .btn-host-toggle:hover { color: var(--accent); background: var(--accent-dim); }

  .field {
    width: 100%;
    padding: 13px 16px;
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    font-weight: 500;
    outline: none;
    transition: border-color .15s;
  }
  .field:focus { border-color: var(--accent); }
  .field::placeholder { color: var(--text-dim); }
  .field.err { border-color: var(--danger); }

  .btn-solid {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  .btn-solid.host-btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .btn-solid:hover { opacity: .88; }
  .btn-solid:active { transform: scale(.97); }

  /* ── MAIN ── */
  #main-screen {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .app-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .app-title {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: 1.4rem;
    letter-spacing: -.03em;
    color: var(--accent);
  }
  .user-pill {
    background: var(--accent-dim);
    color: var(--accent);
    border-radius: 20px;
    padding: 5px 14px;
    font-weight: 700;
    font-size: .82rem;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .user-pill.is-host {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
  }
  .status-row { display: flex; align-items: center; gap: 7px; font-size: .8rem; color: var(--text-dim); }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-dim); flex-shrink: 0; transition: background .3s;
  }
  .status-dot.ok  { background: var(--green); }
  .status-dot.err { background: var(--danger); }
  .my-tag {
    margin-left: auto;
    background: var(--green-bg);
    color: var(--green);
    border: 1px solid var(--green-bd);
    border-radius: 20px;
    padding: 3px 10px;
    font-weight: 700;
    font-size: .78rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    box-shadow: var(--sh);
  }
  .card-lbl {
    font-size: .73rem;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 11px;
  }

  /* ── BOARD ── */
  #board { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  /* columns set dynamically by JS */

  body.host-mode #board .cell { cursor: default; pointer-events: none; }
  body.host-mode #board .cell.won { pointer-events: auto; }

  .cell {
    aspect-ratio: 1;
    border-radius: 7px;
    background: var(--cell-empty);
    border: 1.5px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
    position: relative;
    padding: 0 1px;
    transition: background .12s, transform .1s, border-color .12s;
    font-family: inherit;
    -webkit-appearance: none;
  }
  .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .cell:not(.taken):not(.mine):not(.won):hover {
    background: var(--cell-ehov); border-color: var(--accent); transform: scale(1.07);
  }
  .cell:not(.taken):not(.mine):not(.won):active { transform: scale(.94); }
  .cell.taken { background: var(--cell-taken); border-color: transparent; cursor: default; }
  .cell.mine  { background: var(--cell-mine);  border-color: var(--green-bd); }
  .cell.won   { background: var(--cell-won);   border-color: var(--gold-bd);  cursor: default; }
  .cell.flash { outline: 2px solid var(--danger); }

  .cn {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: clamp(7px, 1.9vw, 13px);
    line-height: 1;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .cell.taken .cn, .cell.mine .cn { font-size: clamp(6px, 1.6vw, 11px); }
  .cell.won .cn { color: var(--cell-won-t); }
  .cw {
    font-size: clamp(5px, 1.3vw, 9px);
    font-weight: 600;
    color: var(--cell-taken-t);
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: calc(100% - 2px);
    line-height: 1.2;
  }
  .cell.mine .cw { color: var(--cell-mine-t); }
  .cell.won .cw  { color: var(--cell-won-t); }
  .cstar {
    position: absolute;
    top: 1px; right: 2px;
    font-size: clamp(5px, 1vw, 7px);
    color: var(--gold);
    line-height: 1;
  }

  /* ── LEGEND ── */
  .legend {
    display: flex; flex-wrap: wrap; gap: 8px 14px;
    margin-top: 13px; padding-top: 13px;
    border-top: 1px solid var(--border);
    font-size: .76rem; color: var(--text-dim);
  }
  .li { display: flex; align-items: center; gap: 5px; }
  .lsw { width: 13px; height: 13px; border-radius: 4px; flex-shrink: 0; }

  /* ── RAFFLE CARD ── */
  .raffle-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .raffle-title {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: 1.05rem;
    letter-spacing: -.02em;
  }
  .raffle-ctr { font-size: .8rem; color: var(--text-dim); }

  #host-controls { border-bottom: 1px solid var(--border); padding-bottom: 14px; margin-bottom: 14px; }
  .raffle-controls { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .cnt-group {
    display: flex; align-items: center; gap: 7px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 14px; white-space: nowrap;
  }
  .cnt-group label { font-size: .85rem; color: var(--text-dim); font-weight: 500; }
  .cnt-group input {
    width: 52px; background: transparent; border: none;
    color: var(--text); font-family: 'Montserrat', sans-serif;
    font-weight: 700; font-size: 1rem; text-align: center;
    outline: none; font-variant-numeric: tabular-nums;
  }
  .cnt-group span { font-size: .85rem; color: var(--text-dim); }

  .btn-draw {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border: none; border-radius: 10px;
    padding: 11px 22px; font-family: inherit; font-weight: 700;
    font-size: .95rem; cursor: pointer;
    transition: opacity .15s, transform .1s;
    flex: 1; min-width: 110px; white-space: nowrap;
  }
  .btn-draw:hover { opacity: .88; }
  .btn-draw:active { transform: scale(.97); }
  .btn-draw:disabled { opacity: .4; cursor: not-allowed; transform: none; }

  .btn-ghost {
    background: transparent; color: var(--text-dim);
    border: 1.5px solid var(--border); border-radius: 9px;
    padding: 9px 14px; font-family: inherit; font-weight: 600;
    font-size: .82rem; cursor: pointer;
    transition: color .15s, border-color .15s; white-space: nowrap;
  }
  .btn-ghost.warn { color: var(--danger); border-color: var(--danger); }

  .winners-empty { text-align: center; color: var(--text-dim); font-size: .85rem; padding: 18px 0 8px; }

  .winners-list { display: flex; flex-direction: column; gap: 7px; }
  .w-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--gold-bg); border: 1px solid var(--gold-bd);
    border-radius: 11px; padding: 11px 15px;
    animation: row-in .38s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes row-in {
    from { opacity: 0; transform: translateY(-5px) scale(.95); }
    to   { opacity: 1; transform: none; }
  }
  .w-rank { font-size: 1.1rem; min-width: 24px; text-align: center; }
  .w-num {
    font-family: 'Montserrat', sans-serif; font-weight: 900;
    font-size: 1.25rem; color: var(--text);
    font-variant-numeric: tabular-nums; min-width: 44px;
  }
  .w-name { font-weight: 700; font-size: .95rem; color: var(--text); }
  .done-msg { margin-top: 12px; text-align: center; font-weight: 700; font-size: .9rem; color: var(--gold); }

  /* ── OVERLAY ── */
  #overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.82);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; backdrop-filter: blur(7px); padding: 24px;
  }
  .ov-card {
    background: var(--surface); border: 2px solid var(--gold-bd);
    border-radius: 28px; padding: 52px 40px 44px;
    text-align: center; max-width: 360px; width: 100%;
    display: flex; flex-direction: column; align-items: center; gap: 13px;
    box-shadow: 0 0 80px rgba(200,150,0,.2), var(--sh-lg);
    animation: card-pop .42s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes card-pop {
    from { opacity: 0; transform: scale(.6) translateY(20px); }
    to   { opacity: 1; transform: none; }
  }
  @media (max-width: 400px) { .ov-card { padding: 40px 24px 36px; } }
  .ov-emoji { font-size: 3.5rem; line-height: 1; }
  .ov-eyebrow { font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); }
  .ov-num { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 5.5rem; letter-spacing: -.06em; line-height: 1; color: var(--gold); }
  .ov-name { font-weight: 700; font-size: 1.45rem; color: var(--text); text-wrap: balance; }
  .ov-sub  { font-size: .84rem; color: var(--text-dim); }
  #btn-close {
    margin-top: 6px; background: var(--accent); color: #fff;
    border: none; border-radius: 12px; padding: 13px 36px;
    font-family: inherit; font-weight: 700; font-size: .95rem;
    cursor: pointer; transition: opacity .15s;
  }
  #btn-close:hover { opacity: .88; }

  /* ── CONFETTI ── */
  .confetti-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 300; overflow: hidden; }
  .cf { position: absolute; width: 10px; height: 10px; border-radius: 2px; animation: cf-fall linear forwards; opacity: 0; }
  @keyframes cf-fall {
    0%   { opacity: 1; transform: translateY(-20px) rotate(0deg); }
    100% { opacity: 0; transform: translateY(110vh) rotate(720deg); }
  }
  </style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-icon" id="login-icon">🎯</div>
    <div id="host-badge" hidden class="host-badge">진행자 모드</div>
    <h1 id="login-title">뽑기판</h1>
    <p id="login-desc">이름을 입력하고 원하는 번호를 골라보세요</p>
    <input type="text" class="field" id="name-input"
           placeholder="이름 입력 (최대 8자)" maxlength="8"
           autocomplete="off" autocorrect="off" autocapitalize="off">
    <button class="btn-solid" id="login-btn">참가자 입장 →</button>
    <div id="host-pw-section" hidden style="width:100%;display:flex;flex-direction:column;gap:10px;">
      <input type="password" class="field" id="pw-input"
             placeholder="진행자 비밀번호 입력" maxlength="20" autocomplete="off">
      <button class="btn-solid host-btn" id="host-login-btn">진행자 입장 →</button>
      <span id="pw-err" hidden style="color:var(--danger);font-size:.82rem;text-align:center;">비밀번호가 올바르지 않습니다</span>
    </div>
    <button class="btn-host-toggle" id="host-toggle-btn">🎰 진행자로 입장</button>
  </div>
</div>

<!-- ── MAIN ── -->
<div id="main-screen" hidden>
  <div class="app-bar">
    <span class="app-title">🎯 뽑기판</span>
    <span class="user-pill" id="user-pill"></span>
  </div>

  <div class="status-row">
    <div class="status-dot" id="sdot"></div>
    <span id="slabel">연결 중…</span>
    <span class="my-tag" id="my-tag" hidden></span>
  </div>

  <div class="card">
    <div class="card-lbl" id="board-lbl">번호 선택 (1 ~ 120)</div>
    <div id="board"></div>
    <div class="legend">
      <div class="li"><div class="lsw" style="background:var(--cell-empty);border:1px solid var(--border)"></div><span>빈 번호</span></div>
      <div class="li" id="leg-mine"><div class="lsw" style="background:var(--cell-mine);border:1.5px solid var(--green-bd)"></div><span>내 번호</span></div>
      <div class="li"><div class="lsw" style="background:var(--cell-taken)"></div><span>다른 사람</span></div>
      <div class="li"><div class="lsw" style="background:var(--cell-won);border:1px solid var(--gold-bd)"></div><span>★ 당첨번호</span></div>
    </div>
    <p id="cancel-hint" style="margin-top:10px;font-size:.78rem;color:var(--text-dim);text-align:center;">
      💡 내 번호를 다시 클릭하면 선택이 해제됩니다
    </p>
  </div>

  <div class="card">
    <div class="raffle-top">
      <span class="raffle-title">🏆 당첨 현황</span>
      <span class="raffle-ctr" id="raffle-ctr"></span>
    </div>

    <div id="host-controls" hidden>
      <div class="raffle-controls" style="margin-bottom:11px;">
        <div class="cnt-group">
          <label for="size-inp">참가자 수</label>
          <input type="number" id="size-inp" min="1" max="500" value="120">
          <span>명</span>
        </div>
        <button class="btn-ghost" id="size-btn">적용</button>
      </div>
      <div style="border-top:1px solid var(--border);margin-bottom:11px;"></div>
      <div class="raffle-controls">
        <div class="cnt-group">
          <label for="total-inp">당첨자 수</label>
          <input type="number" id="total-inp" min="1" max="500" value="4">
          <span>명</span>
        </div>
        <button class="btn-draw" id="draw-btn">🎰 추첨하기</button>
        <button class="btn-ghost" id="reset-btn">초기화</button>
      </div>
    </div>

    <div class="winners-list" id="winners-list"></div>
    <div class="winners-empty" id="winners-empty">아직 추첨된 번호가 없습니다</div>
    <div class="done-msg" id="done-msg" hidden>🎉 모든 당첨자 추첨이 완료되었습니다!</div>
  </div>
</div>

<!-- ── WINNER OVERLAY ── -->
<div id="overlay" hidden>
  <div class="ov-card">
    <div class="ov-emoji" id="ov-emoji">🎊</div>
    <div class="ov-eyebrow" id="ov-eyebrow">당첨</div>
    <div class="ov-num" id="ov-num">-</div>
    <div class="ov-name" id="ov-name">-</div>
    <div class="ov-sub" id="ov-sub"></div>
    <button id="btn-close">확인</button>
  </div>
</div>

<div class="confetti-wrap" id="cf-wrap"></div>

<script>
(function () {
  'use strict';

  /* ─── Firebase Firestore ─── */
  const fsDb = firebase.firestore();

  /* ─── 역할 ─── */
  let isHost = false;

  /* ─── LocalStorage ─── */
  const LS_N = 'lotto_name_v2', LS_U = 'lotto_uid_v2';
  function ls(k)      { try { return localStorage.getItem(k); } catch { return null; } }
  function lsSet(k,v) { try { localStorage.setItem(k,v); } catch {} }
  function mkUid() {
    return (typeof crypto !== 'undefined' && crypto.randomUUID)
      ? crypto.randomUUID()
      : Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  /* ─── 앱 상태 ─── */
  let myName = '', myId = '';
  let picks  = {};
  let raffle = { totalWinners: 4, winners: [] };
  let wonSet = new Set();
  let lastWinnersLen = 0;
  let boardSize      = 120;
  let resetConfirm   = false;
  let resetTimer     = null;

  /* ─── DOM ─── */
  const $ = id => document.getElementById(id);
  const loginScreen  = $('login-screen');
  const mainScreen   = $('main-screen');
  const nameInput    = $('name-input');
  const loginBtn     = $('login-btn');
  const userPill     = $('user-pill');
  const sdot         = $('sdot');
  const slabel       = $('slabel');
  const myTag        = $('my-tag');
  const boardEl      = $('board');
  const hostControls = $('host-controls');
  const drawBtn      = $('draw-btn');
  const resetBtn     = $('reset-btn');
  const totalInp     = $('total-inp');
  const sizeInp      = $('size-inp');
  const sizeBtn      = $('size-btn');
  const winnerList   = $('winners-list');
  const winnersEmpty = $('winners-empty');
  const doneMsg      = $('done-msg');
  const raffleCtr    = $('raffle-ctr');
  const overlay      = $('overlay');
  const ovEmoji      = $('ov-emoji');
  const ovEyebrow    = $('ov-eyebrow');
  const ovNum        = $('ov-num');
  const ovName       = $('ov-name');
  const ovSub        = $('ov-sub');
  const cfWrap       = $('cf-wrap');

  const HOST_PW = '1231';
  let hostPwMode = false;

  /* ─── 로그인 UI ─── */
  function applyLoginMode() {
    const pwSection = $('host-pw-section');
    const toggleBtn = $('host-toggle-btn');
    const pwErr     = $('pw-err');

    if (hostPwMode) {
      $('login-icon').textContent = '🎰';
      $('host-badge').hidden = false;
      $('login-title').textContent = '뽑기판 진행자';
      $('login-desc').textContent  = '진행자 비밀번호를 입력해주세요';
      loginBtn.hidden = true;
      pwSection.hidden = false;
      toggleBtn.textContent = '← 참가자로 전환';
      pwErr.hidden = true;
      $('pw-input').value = '';
      setTimeout(() => $('pw-input').focus(), 50);
    } else {
      $('login-icon').textContent = '🎯';
      $('host-badge').hidden = true;
      $('login-title').textContent = '뽑기판';
      $('login-desc').textContent  = '이름을 입력하고 원하는 번호를 골라보세요';
      loginBtn.hidden = false;
      loginBtn.textContent = '참가자 입장 →';
      loginBtn.classList.remove('host-btn');
      pwSection.hidden = true;
      toggleBtn.textContent = '🎰 진행자로 입장';
      isHost = false;
    }
  }

  $('host-toggle-btn').addEventListener('click', () => {
    hostPwMode = !hostPwMode;
    applyLoginMode();
  });

  function doHostLogin() {
    const name = nameInput.value.trim();
    const pw   = $('pw-input').value;
    const pwErr = $('pw-err');

    if (!name) { nameInput.classList.add('err'); nameInput.focus(); return; }
    nameInput.classList.remove('err');

    if (pw !== HOST_PW) {
      pwErr.hidden = false;
      $('pw-input').classList.add('err');
      $('pw-input').select();
      return;
    }
    pwErr.hidden = true;
    $('pw-input').classList.remove('err');

    isHost = true;
    myName = name;
    myId   = ls(LS_U) || mkUid();
    lsSet(LS_N, myName);
    lsSet(LS_U, myId);
    enterMain();
  }

  $('host-login-btn').addEventListener('click', doHostLogin);
  $('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') doHostLogin(); });

  applyLoginMode();

  /* ─── 부트 ─── */
  function boot() {
    const saved = ls(LS_N);
    if (saved && saved.trim()) nameInput.value = saved.trim();
  }

  loginBtn.addEventListener('click', doLogin);
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  function doLogin() {
    const v = nameInput.value.trim();
    if (!v) { nameInput.classList.add('err'); nameInput.focus(); return; }
    nameInput.classList.remove('err');
    myName = v;
    myId   = ls(LS_U) || mkUid();
    lsSet(LS_N, myName);
    lsSet(LS_U, myId);
    enterMain();
  }

  function enterMain() {
    loginScreen.hidden = true;
    mainScreen.hidden  = false;

    if (isHost) {
      userPill.textContent = '진행자 · ' + myName;
      userPill.classList.add('is-host');
      hostControls.hidden = false;
      $('leg-mine').hidden = true;
      $('cancel-hint').hidden = true;
      document.body.classList.add('host-mode');
    } else {
      userPill.textContent = myName + '님';
    }

    buildBoard();
    initDb();
  }

  /* ─── 보드 ─── */
  function buildBoard() {
    boardEl.innerHTML = '';
    const cols = boardSize <= 25 ? 5 : boardSize <= 100 ? 10 : 20;
    boardEl.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    boardEl.style.gap = boardSize > 100 ? '3px' : '4px';

    for (let i = 1; i <= boardSize; i++) {
      const btn = document.createElement('button');
      btn.className = 'cell';
      btn.id = 'c' + i;
      btn.setAttribute('aria-label', i + '번');
      btn.innerHTML = '<div class="cn">' + i + '</div><div class="cw"></div>';
      if (!isHost) btn.addEventListener('click', () => onCell(i));
      boardEl.appendChild(btn);
    }

    const lbl = $('board-lbl');
    if (lbl) lbl.textContent = (isHost ? '번호 현황' : '번호 선택') + ' (1 ~ ' + boardSize + ')';
    if (isHost && sizeInp) sizeInp.value = boardSize;
  }

  function renderBoard() {
    wonSet = new Set((raffle.winners || []).map(w => String(w.number)));
    const myKey = isHost ? null : Object.keys(picks).find(k => picks[k].userId === myId);

    for (let i = 1; i <= boardSize; i++) {
      const cell = $('c' + i);
      if (!cell) continue;
      const key = String(i), pick = picks[key];
      const cwEl = cell.querySelector('.cw');
      cell.classList.remove('taken', 'mine', 'won', 'flash');

      let star = cell.querySelector('.cstar');
      if (!star) {
        star = document.createElement('span');
        star.className = 'cstar';
        cell.appendChild(star);
      }

      if (wonSet.has(key)) {
        cell.classList.add('won');
        cwEl.textContent = pick ? trunc(pick.name, 5) : '';
        star.textContent = '★';
      } else {
        star.textContent = '';
        if (pick) {
          cell.classList.add(!isHost && pick.userId === myId ? 'mine' : 'taken');
          cwEl.textContent = trunc(pick.name, 5);
        } else {
          cwEl.textContent = '';
        }
      }
    }

    if (!isHost) {
      if (myKey) { myTag.textContent = '내 번호: ' + myKey + '번'; myTag.hidden = false; }
      else myTag.hidden = true;
    }

    renderRaffle();
  }

  function trunc(s, n) {
    const str = String(s);
    return str.length > n ? str.slice(0, n) + '…' : str;
  }

  /* ─── 셀 클릭 ─── */
  async function onCell(num) {
    if (!fsDb || isHost) return;
    const key = String(num);
    if (wonSet.has(key)) return;

    const pick = picks[key];

    if (pick && pick.userId === myId) {
      try { await fsDb.doc('picks/' + key).delete(); } catch (e) { console.error(e); }
      return;
    }
    if (pick) {
      const myKey = Object.keys(picks).find(k => picks[k].userId === myId);
      if (myKey) flashCell('c' + myKey);
      return;
    }
    const myKey = Object.keys(picks).find(k => picks[k].userId === myId);
    if (myKey) { flashCell('c' + myKey); return; }

    try {
      await fsDb.doc('picks/' + key).set({ name: myName, userId: myId, pickedAt: Date.now() });
    } catch (e) { console.error(e); }
  }

  function flashCell(cellId) {
    const el = $(cellId);
    if (!el) return;
    el.classList.add('flash');
    setTimeout(() => el && el.classList.remove('flash'), 800);
  }

  /* ─── 당첨 현황 렌더 ─── */
  function renderRaffle() {
    const winners = raffle.winners || [];
    const total   = raffle.totalWinners || parseInt(isHost ? totalInp.value : '4') || 4;
    const isDone  = winners.length >= total;

    wonSet = new Set(winners.map(w => String(w.number)));
    raffleCtr.textContent = winners.length > 0 ? winners.length + ' / ' + total + '명 추첨됨' : '';

    winnerList.innerHTML = '';
    winnersEmpty.hidden = winners.length > 0;
    const ranks = ['🥇', '🥈', '🥉', '4위', '5위', '6위', '7위', '8위', '9위', '10위'];
    winners.forEach((w, i) => {
      const div = document.createElement('div');
      div.className = 'w-row';
      div.innerHTML =
        '<span class="w-rank">' + (ranks[i] || (i + 1) + '위') + '</span>' +
        '<span class="w-num">' + w.number + '번</span>' +
        '<span class="w-name">' + esc(w.name) + '</span>';
      winnerList.appendChild(div);
    });

    doneMsg.hidden = !isDone || winners.length === 0;

    if (isHost) {
      const eligible = Object.keys(picks).filter(k => !wonSet.has(k) && parseInt(k) <= boardSize);
      drawBtn.disabled = isDone || eligible.length === 0;
      if (isDone) drawBtn.textContent = '✓ 추첨 완료';
      else if (winners.length > 0) drawBtn.textContent = '🎰 ' + (winners.length + 1) + '번째 추첨';
      else drawBtn.textContent = '🎰 추첨하기';
      if (raffle.totalWinners) totalInp.value = raffle.totalWinners;
    }
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ─── 추첨 ─── */
  drawBtn.addEventListener('click', doDraw);

  async function doDraw() {
    if (!fsDb || !isHost) return;
    const total   = parseInt(totalInp.value) || 4;
    const current = raffle.winners || [];
    if (current.length >= total) return;

    const drawnSet = new Set(current.map(w => String(w.number)));
    const eligible = Object.keys(picks).filter(k => !drawnSet.has(k) && parseInt(k) <= boardSize);
    if (eligible.length === 0) return;

    drawBtn.disabled = true;

    const pickedKey  = eligible[Math.floor(Math.random() * eligible.length)];
    const pickedData = picks[pickedKey];
    const newW = { number: parseInt(pickedKey), name: pickedData.name, userId: pickedData.userId, round: current.length + 1 };

    try {
      await fsDb.doc('raffle/state').set({ totalWinners: total, winners: [...current, newW] });
    } catch (e) {
      console.error('Draw failed:', e);
      drawBtn.disabled = false;
    }
  }

  /* ─── 당첨 오버레이 ─── */
  const trophies = ['🏆', '🥈', '🥉', '🎁', '🎊', '✨', '🌟', '💫'];
  const rankLbl  = ['🥇 1등', '🥈 2등', '🥉 3등'];

  function showOverlay(w, round, total) {
    ovEmoji.textContent   = trophies[round - 1] || '🎊';
    ovEyebrow.textContent = (rankLbl[round - 1] || round + '등') + ' (' + round + '/' + total + '명)';
    ovNum.textContent     = w.number + '번';
    ovName.textContent    = w.name;
    ovSub.textContent     = '축하합니다! 🎉';
    overlay.hidden = false;
  }

  $('btn-close').addEventListener('click', () => { overlay.hidden = true; });

  /* ─── 컨페티 ─── */
  const COLORS = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff','#ff9f43'];
  function launchConfetti() {
    cfWrap.innerHTML = '';
    for (let i = 0; i < 60; i++) {
      const el = document.createElement('div');
      el.className = 'cf';
      el.style.left   = Math.random() * 100 + 'vw';
      el.style.top    = '-12px';
      el.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
      el.style.width  = (6 + Math.random() * 10) + 'px';
      el.style.height = (6 + Math.random() * 10) + 'px';
      el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      el.style.animationDelay    = (Math.random() * 0.8) + 's';
      cfWrap.appendChild(el);
    }
    setTimeout(() => { cfWrap.innerHTML = ''; }, 4000);
  }

  /* ─── 초기화 ─── */
  resetBtn.addEventListener('click', async () => {
    if (!fsDb || !isHost) return;
    if (!resetConfirm) {
      resetConfirm = true;
      resetBtn.textContent = '한 번 더 클릭하면 초기화';
      resetBtn.classList.add('warn');
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => {
        resetConfirm = false;
        resetBtn.textContent = '초기화';
        resetBtn.classList.remove('warn');
      }, 3000);
      return;
    }
    clearTimeout(resetTimer);
    resetConfirm = false;
    resetBtn.textContent = '초기화';
    resetBtn.classList.remove('warn');

    for (const k of Object.keys(picks)) {
      try { await fsDb.doc('picks/' + k).delete(); } catch {}
    }
    try { await fsDb.doc('raffle/state').delete(); } catch {}
    lastWinnersLen = 0;
    raffle = { totalWinners: parseInt(totalInp.value) || 4, winners: [] };
    picks  = {};
    renderBoard();
  });

  /* ─── 참가자 수 변경 ─── */
  sizeBtn.addEventListener('click', async () => {
    if (!fsDb || !isHost) return;
    let newSize = parseInt(sizeInp.value) || 120;
    newSize = Math.max(1, Math.min(500, newSize));
    sizeInp.value = newSize;
    try { await fsDb.doc('config/board').set({ size: newSize }); }
    catch (e) { console.error('Board size update failed:', e); }
  });
  sizeInp.addEventListener('keydown', e => { if (e.key === 'Enter') sizeBtn.click(); });
  sizeInp.addEventListener('change', () => {
    let v = parseInt(sizeInp.value) || 120;
    sizeInp.value = Math.max(1, Math.min(500, v));
  });

  /* ─── DB 연결 (Firebase Firestore) ─── */
  function setStatus(label, ok) {
    slabel.textContent = label;
    sdot.className = 'status-dot ' + (ok ? 'ok' : 'err');
  }

  function initDb() {
    setStatus('실시간 연결됨', true);

    // 참가자 수 (config/board)
    fsDb.doc('config/board').onSnapshot(snap => {
      const newSize = snap.exists ? (snap.data().size || 120) : 120;
      if (newSize !== boardSize) {
        boardSize = newSize;
        buildBoard();
        renderBoard();
      }
    }, err => {
      console.error('config snap err:', err);
      setStatus('연결 오류', false);
    });

    // 번호 선택 현황
    fsDb.collection('picks').onSnapshot(snap => {
      picks = {};
      snap.docs.forEach(doc => { if (doc.exists) picks[doc.id] = doc.data(); });
      renderBoard();
    }, err => {
      console.error('picks snap err:', err);
      setStatus('연결 오류: ' + err.code, false);
    });

    // 추첨 상태 — 새 당첨자 감지 시 전원에게 오버레이 표시
    fsDb.doc('raffle/state').onSnapshot(snap => {
      if (snap.exists) {
        const d = snap.data();
        const newWinners = Array.isArray(d.winners) ? d.winners : [];
        const newTotal   = d.totalWinners || 4;
        const newLen     = newWinners.length;

        if (newLen > lastWinnersLen && newLen > 0) {
          showOverlay(newWinners[newLen - 1], newLen, newTotal);
          launchConfetti();
        }
        lastWinnersLen = newLen;
        raffle = { totalWinners: newTotal, winners: newWinners };
      } else {
        lastWinnersLen = 0;
        raffle = { totalWinners: isHost ? (parseInt(totalInp.value) || 4) : 4, winners: [] };
      }
      renderBoard();
    }, err => {
      console.error('raffle snap err:', err);
    });
  }

  boot();
})();
</script>
</body>
</html>
